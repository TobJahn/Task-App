<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My Tasks</h1>
    <form id="task-form" class="task-form">
      <label for="task-input" class="sr-only">New task</label>
      <input type="text" id="task-input" placeholder="Add a new task…" autocomplete="off">
      <button type="submit" id="add-btn">Add</button>
    </form>
    <ul id="task-list" class="task-list"></ul>
    <div class="list-footer">
      <button type="button" id="clear-completed" class="clear-btn" hidden>Clear completed</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
